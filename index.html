<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WuXi — Mandarin Vocabulary</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #0a0f1a;
      --bg2:         #0f1623;
      --surface:     #111827;
      --surface2:    #1a2332;
      --border:      #1f2d40;
      --border2:     #263548;
      --text:        #e8edf5;
      --text2:       #8fa3bc;
      --text3:       #5a7490;
      --gold:        #e2c97e;
      --orange:      #f97316;
      --accent:      linear-gradient(135deg, #e2c97e 0%, #f97316 100%);
      --accent-rev:  linear-gradient(135deg, #f97316 0%, #e2c97e 100%);
      --new:         #64748b;
      --learning:    #3b82f6;
      --familiar:    #eab308;
      --practiced:   #f97316;
      --mastered:    #22c55e;
      --radius:      14px;
      --radius-sm:   8px;
      --shadow:      0 4px 24px rgba(0,0,0,0.4);
      --shadow-lg:   0 8px 48px rgba(0,0,0,0.6);
      --transition:  0.2s ease;
    }

    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Inter', system-ui, sans-serif; overflow: hidden; }

    #root { height: 100vh; display: flex; flex-direction: column; }

    /* ── Scrollable screen wrapper ─────────────────────────────────── */
    .screen { flex: 1; overflow-y: auto; padding-bottom: 40px; }
    .screen::-webkit-scrollbar { width: 6px; }
    .screen::-webkit-scrollbar-track { background: var(--bg); }
    .screen::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

    /* ── Nav bar ────────────────────────────────────────────────────── */
    .nav-bar {
      display: flex; align-items: center; gap: 12px;
      padding: 0 24px; height: 60px; min-height: 60px;
      background: var(--surface); border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 100;
    }
    .nav-bar .logo {
      font-family: 'Noto Serif SC', serif; font-size: 22px; font-weight: 700;
      background: var(--accent); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; letter-spacing: 1px; margin-right: auto;
    }
    .nav-bar .nav-subtitle { font-size: 12px; color: var(--text3); }
    .back-btn {
      display: flex; align-items: center; gap: 6px; padding: 7px 14px;
      background: var(--surface2); border: 1px solid var(--border2); border-radius: var(--radius-sm);
      color: var(--text2); font-size: 13px; font-weight: 500; cursor: pointer;
      transition: var(--transition); user-select: none;
    }
    .back-btn:hover { background: var(--border); color: var(--text); border-color: var(--border2); }
    .back-btn svg { width: 14px; height: 14px; }

    /* ── Buttons ────────────────────────────────────────────────────── */
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 20px; border-radius: var(--radius-sm); border: none;
      font-size: 14px; font-weight: 600; cursor: pointer; transition: var(--transition);
      user-select: none; text-decoration: none;
    }
    .btn-primary {
      background: linear-gradient(135deg, #e2c97e, #f97316);
      color: #0a0f1a; box-shadow: 0 2px 16px rgba(249,115,22,0.3);
    }
    .btn-primary:hover { box-shadow: 0 4px 24px rgba(249,115,22,0.5); transform: translateY(-1px); }
    .btn-secondary {
      background: var(--surface2); border: 1px solid var(--border2); color: var(--text2);
    }
    .btn-secondary:hover { background: var(--border); color: var(--text); }
    .btn-ghost { background: transparent; color: var(--text3); }
    .btn-ghost:hover { color: var(--text2); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; }

    /* ── Cards ──────────────────────────────────────────────────────── */
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 20px; transition: var(--transition);
    }
    .card:hover { border-color: var(--border2); transform: translateY(-2px); box-shadow: var(--shadow); }
    .card.clickable { cursor: pointer; }

    /* ── Mastery badge ──────────────────────────────────────────────── */
    .mastery-badge {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 3px 9px; border-radius: 20px; font-size: 11px; font-weight: 600;
      letter-spacing: 0.5px; text-transform: uppercase;
    }
    .mastery-badge .dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }

    /* ── Progress bar ───────────────────────────────────────────────── */
    .progress-track {
      height: 5px; background: var(--surface2); border-radius: 3px; overflow: hidden; width: 100%;
    }
    .progress-fill {
      height: 100%; border-radius: 3px;
      background: linear-gradient(90deg, #e2c97e, #f97316);
      transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* ── Home Screen ─────────────────────────────────────────────────── */
    .home-header {
      padding: 40px 24px 28px; text-align: center;
    }
    .home-title {
      font-family: 'Noto Serif SC', serif; font-size: 38px; font-weight: 700;
      background: var(--accent); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; margin-bottom: 8px;
    }
    .home-subtitle { font-size: 14px; color: var(--text3); max-width: 360px; margin: 0 auto; line-height: 1.6; }

    .stats-row {
      display: flex; justify-content: center; gap: 32px;
      padding: 16px 24px 28px; margin: 0 24px;
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    }
    .stat-item { text-align: center; }
    .stat-num { font-size: 26px; font-weight: 700; color: var(--gold); font-family: 'Inter', sans-serif; }
    .stat-label { font-size: 11px; color: var(--text3); margin-top: 2px; text-transform: uppercase; letter-spacing: 0.5px; }

    .section-title {
      font-size: 12px; font-weight: 600; color: var(--text3); text-transform: uppercase;
      letter-spacing: 1px; padding: 24px 24px 12px;
    }

    .lesson-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px; padding: 0 24px;
    }
    .lesson-card { cursor: pointer; }
    .lesson-card-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 10px; }
    .lesson-icon {
      width: 42px; height: 42px; border-radius: 10px; display: flex; align-items: center; justify-content: center;
      font-size: 20px; background: var(--surface2); border: 1px solid var(--border2); flex-shrink: 0;
    }
    .lesson-title { font-size: 16px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
    .lesson-desc { font-size: 12px; color: var(--text3); line-height: 1.5; margin-bottom: 14px; }
    .lesson-meta { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .word-count { font-size: 12px; color: var(--text3); }
    .mastery-pct { font-size: 12px; font-weight: 600; color: var(--gold); }

    /* ── Lesson Screen ──────────────────────────────────────────────── */
    .lesson-hero { padding: 28px 24px 20px; }
    .lesson-hero-title { font-family: 'Noto Serif SC', serif; font-size: 28px; font-weight: 700; margin-bottom: 6px; }
    .lesson-hero-desc { font-size: 13px; color: var(--text3); line-height: 1.6; margin-bottom: 16px; }
    .lesson-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

    .filter-tabs {
      display: flex; gap: 6px; padding: 0 24px 16px;
    }
    .filter-tab {
      padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 500; cursor: pointer;
      border: 1px solid var(--border2); background: var(--surface); color: var(--text3);
      transition: var(--transition); user-select: none;
    }
    .filter-tab.active { background: var(--surface2); border-color: var(--gold); color: var(--gold); }
    .filter-tab:hover:not(.active) { color: var(--text2); border-color: var(--border2); background: var(--surface2); }
    .filter-count {
      display: inline-flex; align-items: center; justify-content: center;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 10px; padding: 1px 7px; font-size: 10px; margin-left: 5px;
    }

    .word-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 12px; padding: 0 24px;
    }
    .word-card { cursor: pointer; padding: 16px; }
    .word-card-hanzi {
      font-family: 'Noto Serif SC', serif; font-size: 32px; font-weight: 600;
      line-height: 1.1; margin-bottom: 6px; color: var(--text);
    }
    .word-card-pinyin { font-size: 12px; color: var(--gold); margin-bottom: 4px; font-weight: 500; }
    .word-card-meaning { font-size: 12px; color: var(--text3); line-height: 1.4; }
    .word-card-footer { display: flex; justify-content: flex-end; margin-top: 10px; }

    /* ── Word Review Screen ─────────────────────────────────────────── */
    .word-review-body { padding: 24px; max-width: 600px; margin: 0 auto; }
    .word-review-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 20px; padding: 40px 32px; text-align: center; margin-bottom: 20px;
    }
    .hanzi-main {
      font-family: 'Noto Serif SC', serif; font-size: 96px; font-weight: 700;
      line-height: 1; margin-bottom: 16px; letter-spacing: -2px;
      background: linear-gradient(160deg, #fff 60%, #e2c97e);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .pinyin-main {
      font-size: 22px; color: var(--gold); font-weight: 500; margin-bottom: 12px; letter-spacing: 1px;
    }
    .meaning-main { font-size: 20px; color: var(--text); font-weight: 500; margin-bottom: 28px; }
    .divider { height: 1px; background: var(--border); margin: 24px 0; }
    .example-section { text-align: left; }
    .example-label { font-size: 10px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
    .example-hanzi { font-family: 'Noto Serif SC', serif; font-size: 22px; color: var(--text); margin-bottom: 6px; }
    .example-pinyin { font-size: 13px; color: var(--gold); margin-bottom: 6px; }
    .example-meaning { font-size: 13px; color: var(--text3); font-style: italic; }

    .stats-grid {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px;
    }
    .stat-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm);
      padding: 14px; text-align: center;
    }
    .stat-card-num { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
    .stat-card-label { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.5px; }

    /* ── Quiz Screen ────────────────────────────────────────────────── */
    .quiz-body { padding: 24px; max-width: 640px; margin: 0 auto; }
    .quiz-header { margin-bottom: 28px; }
    .quiz-progress-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .quiz-progress-label { font-size: 12px; color: var(--text3); }
    .quiz-mode-badge {
      font-size: 11px; font-weight: 600; color: var(--gold); background: rgba(226,201,126,0.1);
      border: 1px solid rgba(226,201,126,0.2); border-radius: 20px; padding: 3px 10px;
    }
    .quiz-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 20px;
      padding: 40px 32px; text-align: center; margin-bottom: 20px; min-height: 180px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .quiz-question-label { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 16px; }
    .quiz-hanzi { font-family: 'Noto Serif SC', serif; font-size: 72px; font-weight: 700; line-height: 1; color: var(--text); }
    .quiz-meaning-q { font-size: 24px; font-weight: 500; color: var(--text); line-height: 1.4; }
    .quiz-pinyin-q { font-size: 28px; color: var(--gold); font-weight: 500; letter-spacing: 1px; }

    .quiz-options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 24px; }
    .quiz-option {
      background: var(--surface); border: 1.5px solid var(--border2);
      border-radius: var(--radius); padding: 16px 18px; cursor: pointer;
      transition: var(--transition); text-align: center; user-select: none;
    }
    .quiz-option:hover:not(.answered) { border-color: var(--gold); background: var(--surface2); transform: translateY(-1px); }
    .quiz-option.correct { border-color: #22c55e !important; background: rgba(34,197,94,0.1) !important; }
    .quiz-option.wrong   { border-color: #ef4444 !important; background: rgba(239,68,68,0.1) !important; }
    .quiz-option.answered { cursor: default; }
    .quiz-option-hanzi { font-family: 'Noto Serif SC', serif; font-size: 28px; font-weight: 600; color: var(--text); }
    .quiz-option-meaning { font-size: 14px; color: var(--text2); }
    .quiz-option-pinyin { font-size: 12px; color: var(--gold); margin-top: 2px; }

    .feedback-row { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; min-height: 36px; }
    .feedback-correct { color: #22c55e; font-weight: 600; font-size: 15px; }
    .feedback-wrong   { color: #ef4444; font-weight: 600; font-size: 15px; }

    /* ── Quiz Summary ───────────────────────────────────────────────── */
    .summary-body { padding: 40px 24px; max-width: 500px; margin: 0 auto; text-align: center; }
    .summary-score { font-size: 80px; font-weight: 700; line-height: 1; margin-bottom: 6px; }
    .summary-score.perfect { background: var(--accent); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .summary-score.good { color: #22c55e; }
    .summary-score.okay { color: #eab308; }
    .summary-score.bad  { color: #ef4444; }
    .summary-label { font-size: 14px; color: var(--text3); margin-bottom: 32px; }
    .summary-breakdown { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 24px 0 32px; text-align: center; }
    .summary-cell { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 16px; }
    .summary-cell-num { font-size: 28px; font-weight: 700; margin-bottom: 4px; }
    .summary-cell-label { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.5px; }
    .summary-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

    /* ── Empty state ─────────────────────────────────────────────────── */
    .empty-state { text-align: center; padding: 60px 24px; color: var(--text3); }
    .empty-state .empty-icon { font-size: 48px; margin-bottom: 16px; }
    .empty-state p { font-size: 14px; line-height: 1.6; }

    /* ── Tooltip / micro-animations ────────────────────────────────── */
    @keyframes pop-in {
      0%   { transform: scale(0.85); opacity: 0; }
      70%  { transform: scale(1.03); }
      100% { transform: scale(1); opacity: 1; }
    }
    .pop-in { animation: pop-in 0.25s ease forwards; }

    @keyframes slide-up {
      from { transform: translateY(12px); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }
    .slide-up { animation: slide-up 0.3s ease forwards; }

    @keyframes pulse-gold {
      0%, 100% { box-shadow: 0 0 0 0 rgba(226,201,126,0.4); }
      50%       { box-shadow: 0 0 0 8px rgba(226,201,126,0); }
    }
    .pulse-gold { animation: pulse-gold 1.5s infinite; }

    /* ── Responsive ─────────────────────────────────────────────────── */
    @media (max-width: 500px) {
      .lesson-grid { grid-template-columns: 1fr; }
      .word-grid { grid-template-columns: repeat(2, 1fr); }
      .quiz-options { grid-template-columns: 1fr; }
      .hanzi-main { font-size: 72px; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useCallback, useMemo, useRef } = React;

// ═══════════════════════════════════════════════════════════════════
// CONSTANTS
// ═══════════════════════════════════════════════════════════════════

const MASTERY_LEVELS = [
  { id: 0, name: 'New',       color: '#64748b', bg: 'rgba(100,116,139,0.12)' },
  { id: 1, name: 'Learning',  color: '#3b82f6', bg: 'rgba(59,130,246,0.12)'  },
  { id: 2, name: 'Familiar',  color: '#eab308', bg: 'rgba(234,179,8,0.12)'   },
  { id: 3, name: 'Practiced', color: '#f97316', bg: 'rgba(249,115,22,0.12)'  },
  { id: 4, name: 'Mastered',  color: '#22c55e', bg: 'rgba(34,197,94,0.12)'   },
];

const QUIZ_MODES = [
  { id: 0, label: 'Hanzi → Meaning', question: 'What does this mean?',         show: 'hanzi',   answer: 'meaning' },
  { id: 1, label: 'Meaning → Hanzi', question: 'Which character is this?',     show: 'meaning', answer: 'hanzi'   },
  { id: 2, label: 'Pinyin → Hanzi',  question: 'Which character matches?',     show: 'pinyin',  answer: 'hanzi'   },
];

// ═══════════════════════════════════════════════════════════════════
// VOCABULARY DATA
// ═══════════════════════════════════════════════════════════════════

const LESSONS = [
  {
    id: 'greetings',
    title: 'Greetings & Basics',
    icon: '👋',
    description: 'Essential phrases and words for everyday introductions and polite exchanges.',
    words: [
      { hanzi:'你好',   pinyin:'nǐ hǎo',       meaning:'hello',            example:'你好，我叫李明。',      examplePinyin:'Nǐ hǎo, wǒ jiào Lǐ Míng.',       exampleMeaning:'Hello, my name is Li Ming.' },
      { hanzi:'谢谢',   pinyin:'xièxiè',        meaning:'thank you',        example:'谢谢你的帮助。',        examplePinyin:'Xièxiè nǐ de bāngzhù.',           exampleMeaning:'Thank you for your help.' },
      { hanzi:'对不起', pinyin:'duìbuqǐ',       meaning:'sorry / excuse me',example:'对不起，我迟到了。',    examplePinyin:'Duìbuqǐ, wǒ chídào le.',          exampleMeaning:'Sorry, I am late.' },
      { hanzi:'没关系', pinyin:'méiguānxi',      meaning:"it's okay / never mind", example:'没关系，没有问题。', examplePinyin:'Méiguānxi, méiyǒu wèntí.',       exampleMeaning:"It's okay, no problem." },
      { hanzi:'请',     pinyin:'qǐng',          meaning:'please / invite',  example:'请坐。',               examplePinyin:'Qǐng zuò.',                       exampleMeaning:'Please sit down.' },
      { hanzi:'再见',   pinyin:'zàijiàn',       meaning:'goodbye',          example:'明天见，再见！',        examplePinyin:'Míngtiān jiàn, zàijiàn!',         exampleMeaning:'See you tomorrow, goodbye!' },
      { hanzi:'是',     pinyin:'shì',           meaning:'yes / to be',      example:'我是学生。',            examplePinyin:'Wǒ shì xuéshēng.',               exampleMeaning:'I am a student.' },
      { hanzi:'不',     pinyin:'bù',            meaning:'no / not',         example:'我不是老师。',          examplePinyin:'Wǒ bù shì lǎoshī.',              exampleMeaning:'I am not a teacher.' },
      { hanzi:'我',     pinyin:'wǒ',            meaning:'I / me',           example:'我来自北京。',          examplePinyin:'Wǒ lái zì Běijīng.',             exampleMeaning:'I am from Beijing.' },
      { hanzi:'你',     pinyin:'nǐ',            meaning:'you',              example:'你叫什么名字？',        examplePinyin:'Nǐ jiào shénme míngzì?',          exampleMeaning:'What is your name?' },
      { hanzi:'早上好', pinyin:'zǎoshang hǎo',  meaning:'good morning',     example:'早上好，吃早饭了吗？',  examplePinyin:'Zǎoshang hǎo, chī zǎofàn le ma?', exampleMeaning:'Good morning, have you eaten breakfast?' },
      { hanzi:'晚上好', pinyin:'wǎnshàng hǎo',  meaning:'good evening',     example:'晚上好，今天怎么样？',  examplePinyin:'Wǎnshàng hǎo, jīntiān zěnmeyàng?', exampleMeaning:'Good evening, how was your day?' },
    ]
  },
  {
    id: 'money',
    title: 'Payment & Money',
    icon: '💳',
    description: 'Vocabulary for shopping, banking, and financial transactions in China.',
    words: [
      { hanzi:'钱',   pinyin:'qián',        meaning:'money',          example:'我没有钱了。',        examplePinyin:'Wǒ méiyǒu qián le.',             exampleMeaning:"I have no money left." },
      { hanzi:'银行', pinyin:'yínháng',      meaning:'bank',           example:'银行几点开门？',      examplePinyin:'Yínháng jǐ diǎn kāimén?',         exampleMeaning:'What time does the bank open?' },
      { hanzi:'信用卡',pinyin:'xìnyòngkǎ',  meaning:'credit card',    example:'可以用信用卡吗？',    examplePinyin:'Kěyǐ yòng xìnyòngkǎ ma?',        exampleMeaning:'Can I pay by credit card?' },
      { hanzi:'现金', pinyin:'xiànjīn',      meaning:'cash',           example:'我只有现金。',        examplePinyin:'Wǒ zhǐyǒu xiànjīn.',             exampleMeaning:'I only have cash.' },
      { hanzi:'付款', pinyin:'fùkuǎn',       meaning:'to pay',         example:'我来付款。',          examplePinyin:'Wǒ lái fùkuǎn.',                 exampleMeaning:'I will pay.' },

// HELPERS
// ═══════════════════════════════════════════════════════════════════

const wordKey = (lessonId, hanzi) => `${lessonId}::${hanzi}`;

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function pickRandom(arr, n) {
  return shuffle(arr).slice(0, n);
}

// ═══════════════════════════════════════════════════════════════════
// MASTERY HOOK
// ═══════════════════════════════════════════════════════════════════

function useMastery() {
  const [masteryData, setMasteryData] = useState(() => {
    try { return JSON.parse(localStorage.getItem('wuxi_mastery')) || {}; }
    catch { return {}; }
  });

  const updateMastery = useCallback((key, correct) => {
    setMasteryData(prev => {
      const cur = prev[key] || { level: 0, streak: 0, correct: 0, wrong: 0 };
      let { level, streak, correct: c, wrong: w } = cur;
      if (correct) {
        streak++;
        c++;
        if (streak >= 2 && level < 4) level++;
      } else {
        streak = 0;
        w++;
        if (level > 0) level--;
      }
      const next = { ...prev, [key]: { level, streak, correct: c, wrong: w } };
      localStorage.setItem('wuxi_mastery', JSON.stringify(next));
      return next;
    });
  }, []);

  const getWordMastery = useCallback((key) =>
    masteryData[key] || { level: 0, streak: 0, correct: 0, wrong: 0 },
  [masteryData]);

  const getLessonProgress = useCallback((lesson) => {
    const words = lesson.words;
    if (!words.length) return { pct: 0, counts: [0,0,0,0,0] };
    const counts = [0,0,0,0,0];
    words.forEach(w => {
      const m = getWordMastery(wordKey(lesson.id, w.hanzi));
      counts[m.level]++;
    });
    const pct = Math.round((counts[3] + counts[4]) / words.length * 100);
    return { pct, counts };
  }, [getWordMastery]);

  return { masteryData, updateMastery, getWordMastery, getLessonProgress };
}

    const levelIdx = MASTERY_LEVELS.findIndex(m => m.name === filter);
    return lesson.words.filter(w => getWordMastery(wordKey(lesson.id, w.hanzi)).level === levelIdx);

              <div className="stat-card-label">Accuracy</div>
            </div>
            <div className="stat-card">
              <div className="stat-card-num" style={{ color: ml.color }}>{m.streak}</div>
              <div className="stat-card-label">Streak</div>
            </div>
          </div>

          <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap', justifyContent: 'center', marginBottom: 16 }}>
            <button className="btn btn-secondary" onClick={() => {
              updateMastery(wordKey(lesson.id, word.hanzi), false);
            }} style={{ borderColor: '#ef444440', color: '#ef4444' }}>
              ✗ Mark Wrong
            </button>
            <button className="btn btn-secondary" onClick={() => {
              updateMastery(wordKey(lesson.id, word.hanzi), true);
            }} style={{ borderColor: '#22c55e40', color: '#22c55e' }}>
              ✓ Mark Correct
            </button>
            <button className="btn btn-primary" onClick={() => navigate('quiz', { lesson })}>
              Quiz this lesson
            </button>
          </div>

          <div style={{ background: 'var(--surface)', border: '1px solid var(--border)', borderRadius: 'var(--radius)', padding: '16px 20px' }}>
            <div style={{ fontSize: 11, fontWeight: 600, color: 'var(--text3)', textTransform: 'uppercase', letterSpacing: 1, marginBottom: 12 }}>Mastery Progress</div>
            <div style={{ display: 'flex', gap: 6 }}>
              {MASTERY_LEVELS.map(lvl => (
                <div key={lvl.id} style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 5 }}>
                  <div style={{
                    width: '100%', height: 6, borderRadius: 3,
                    background: m.level >= lvl.id ? lvl.color : 'var(--surface2)',
                    transition: 'background 0.3s ease',
                    boxShadow: m.level === lvl.id ? `0 0 8px ${lvl.color}80` : 'none'
                  }} />
                  <div style={{ fontSize: 9, color: m.level >= lvl.id ? lvl.color : 'var(--text3)', fontWeight: 600, textTransform: 'uppercase', letterSpacing: 0.3 }}>
                    {lvl.name}
                  </div>
                </div>
              ))}
            </div>
          </div>
        </div>
      </div>
    </>
  );
}

// ═══════════════════════════════════════════════════════════════════
// QUIZ SCREEN
// ═══════════════════════════════════════════════════════════════════

const QUIZ_LENGTH = 10;

function buildQuiz(lesson, getWordMastery) {
  // Weight lower-mastery words more heavily
  const weighted = [];
  lesson.words.forEach(w => {
    const m = getWordMastery(wordKey(lesson.id, w.hanzi));
    const weight = 5 - m.level; // New=5, Mastered=1
    for (let i = 0; i < weight; i++) weighted.push(w);
  });

  const questions = [];
  const used = new Set();
  const pool = shuffle(weighted);

  for (const word of pool) {
    if (used.has(word.hanzi)) continue;
    if (questions.length >= QUIZ_LENGTH) break;
    used.add(word.hanzi);

    const modeIdx = questions.length % QUIZ_MODES.length;
    const mode = QUIZ_MODES[modeIdx];

    // Build 4 options: 1 correct + 3 wrong
    const others = shuffle(lesson.words.filter(w2 => w2.hanzi !== word.hanzi)).slice(0, 3);
    const allOpts = shuffle([word, ...others]);

    questions.push({ word, mode, options: allOpts });
  }

  // Pad if needed with random words
  while (questions.length < Math.min(QUIZ_LENGTH, lesson.words.length)) {
    const word = lesson.words[questions.length % lesson.words.length];
    const modeIdx = questions.length % QUIZ_MODES.length;
    const mode = QUIZ_MODES[modeIdx];
    const others = shuffle(lesson.words.filter(w2 => w2.hanzi !== word.hanzi)).slice(0, 3);
    const allOpts = shuffle([word, ...others]);
    questions.push({ word, mode, options: allOpts });
  }

  return questions;
}

function QuizScreen({ lesson, navigate, updateMastery, getWordMastery }) {
  const questions = useMemo(() => buildQuiz(lesson, getWordMastery), [lesson]);
  const [qIdx, setQIdx] = useState(0);
  const [selected, setSelected] = useState(null); // index into options
  const [results, setResults] = useState([]); // { correct: bool }
  const [done, setDone] = useState(false);

  const q = questions[qIdx];
  const answered = selected !== null;
  const correctIdx = q ? q.options.findIndex(o => o.hanzi === q.word.hanzi) : -1;

  function handleSelect(idx) {
    if (answered) return;
    setSelected(idx);
    const correct = idx === correctIdx;
    updateMastery(wordKey(lesson.id, q.word.hanzi), correct);
    setResults(prev => [...prev, { correct, word: q.word }]);
  }

  function handleNext() {
    if (qIdx + 1 >= questions.length) {
      setDone(true);
    } else {
      setQIdx(i => i + 1);
      setSelected(null);
    }
  }

  function renderQuestionDisplay() {
    const { word, mode } = q;
    if (mode.show === 'hanzi') return (
      <>
        <div className="quiz-question-label">{mode.question}</div>
        <div className="quiz-hanzi">{word.hanzi}</div>
        <div style={{ fontSize: 14, color: 'var(--text3)', marginTop: 8 }}>{word.pinyin}</div>
      </>
    );
    if (mode.show === 'meaning') return (
      <>
        <div className="quiz-question-label">{mode.question}</div>
        <div className="quiz-meaning-q">{word.meaning}</div>
      </>
    );
    if (mode.show === 'pinyin') return (
      <>
        <div className="quiz-question-label">{mode.question}</div>
        <div className="quiz-pinyin-q">{word.pinyin}</div>
      </>
    );
  }

  function renderOption(opt, idx) {
    const { mode } = q;
    let cls = 'quiz-option';
    if (answered) {
      cls += ' answered';
      if (idx === correctIdx) cls += ' correct';
      else if (idx === selected) cls += ' wrong';
    }
    return (
      <div key={opt.hanzi} className={cls} onClick={() => handleSelect(idx)}>
        {mode.answer === 'meaning' && (
          <div className="quiz-option-meaning">{opt.meaning}</div>
        )}
        {mode.answer === 'hanzi' && (
          <>
            <div className="quiz-option-hanzi">{opt.hanzi}</div>
            {mode.show !== 'pinyin' && <div className="quiz-option-pinyin">{opt.pinyin}</div>}
          </>
        )}
      </div>
    );
  }

  if (done) {
    const correctCount = results.filter(r => r.correct).length;
    const pct = Math.round(correctCount / results.length * 100);
    let scoreClass = 'bad';
    if (pct === 100) scoreClass = 'perfect';
    else if (pct >= 70) scoreClass = 'good';
    else if (pct >= 40) scoreClass = 'okay';

    const msgs = {
      perfect: '完美！Perfect score! 🎉',
      good:    '很好！Great work! 👍',
      okay:    '不错！Keep practicing! 💪',
      bad:     '加油！Keep going! 📚',
    };

    return (
      <>
        <NavBar onBack={() => navigate('lesson', { lesson })} title="Quiz Complete" />
        <div className="screen">
          <div className="summary-body slide-up">
            <div className={`summary-score ${scoreClass}`}>{pct}%</div>
            <div className="summary-label">{msgs[scoreClass]}</div>

            <div className="summary-breakdown">
              <div className="summary-cell">
                <div className="summary-cell-num" style={{ color: '#22c55e' }}>{correctCount}</div>
                <div className="summary-cell-label">Correct</div>
              </div>
              <div className="summary-cell">
                <div className="summary-cell-num" style={{ color: '#ef4444' }}>{results.length - correctCount}</div>
                <div className="summary-cell-label">Wrong</div>
              </div>
            </div>

            <div style={{ marginBottom: 24, background: 'var(--surface)', border: '1px solid var(--border)', borderRadius: 'var(--radius)', overflow: 'hidden' }}>
              {results.map((r, i) => (
                <div key={i} style={{
                  display: 'flex', alignItems: 'center', gap: 12, padding: '12px 16px',
                  borderBottom: i < results.length - 1 ? '1px solid var(--border)' : 'none'
                }}>
                  <span style={{ fontSize: 16 }}>{r.correct ? '✓' : '✗'}</span>
                  <span style={{ fontFamily: "'Noto Serif SC', serif", fontSize: 20, flex: 1 }}>{r.word.hanzi}</span>
                  <span style={{ fontSize: 12, color: 'var(--text3)' }}>{r.word.pinyin}</span>
                  <span style={{ fontSize: 12, color: 'var(--text2)' }}>{r.word.meaning}</span>
                </div>
              ))}
            </div>

            <div className="summary-actions">
              <button className="btn btn-secondary" onClick={() => navigate('lesson', { lesson })}>Back to Lesson</button>
              <button className="btn btn-primary" onClick={() => { setQIdx(0); setSelected(null); setResults([]); setDone(false); }}>
                Retry Quiz
              </button>
            </div>
          </div>
        </div>
      </>
    );
  }

  return (
    <>
      <NavBar
        onBack={() => navigate('lesson', { lesson })}
        title={lesson.title}
        actions={<span className="quiz-mode-badge">{q.mode.label}</span>}
      />
      <div className="screen">
        <div className="quiz-body">
          <div className="quiz-header">
            <div className="quiz-progress-row">
              <div className="quiz-progress-label">Question {qIdx + 1} of {questions.length}</div>
              <div className="quiz-progress-label">{results.filter(r=>r.correct).length} correct</div>
            </div>
            <div className="progress-track" style={{ height: 4 }}>
              <div className="progress-fill" style={{ width: `${(qIdx / questions.length) * 100}%` }} />
            </div>
          </div>

          <div className="quiz-card pop-in" key={qIdx}>
            {renderQuestionDisplay()}
          </div>

          <div className="quiz-options pop-in" key={`opts-${qIdx}`}>
            {q.options.map((opt, idx) => renderOption(opt, idx))}
          </div>

          <div className="feedback-row">
            {answered && selected === correctIdx && (
              <div className="feedback-correct pop-in">✓ Correct! <span style={{ color: 'var(--text3)', fontWeight: 400, fontSize: 13 }}>— {q.word.meaning}</span></div>
            )}
            {answered && selected !== correctIdx && (
              <div className="feedback-wrong pop-in">✗ The answer was: <span style={{ fontFamily: "'Noto Serif SC', serif", color: '#22c55e' }}>{q.word.hanzi}</span> <span style={{ color: 'var(--text3)', fontWeight: 400, fontSize: 13 }}>— {q.word.meaning}</span></div>
            )}
          </div>

          <div style={{ display: 'flex', justifyContent: 'flex-end' }}>
            <button
              className="btn btn-primary"
              onClick={handleNext}
              disabled={!answered}
            >
              {qIdx + 1 >= questions.length ? 'See Results' : 'Next →'}
            </button>
          </div>
        </div>
      </div>
    </>
  );
}

// ═══════════════════════════════════════════════════════════════════
// ROOT APP
// ═══════════════════════════════════════════════════════════════════

function App() {
  const [screen, setScreen] = useState('home');
  const [selectedLesson, setSelectedLesson] = useState(null);
  const [selectedWord, setSelectedWord] = useState(null);
  const { masteryData, updateMastery, getWordMastery, getLessonProgress } = useMastery();

  const navigate = useCallback((screen, data = {}) => {
    setScreen(screen);
    if (data.lesson !== undefined) setSelectedLesson(data.lesson);
    if (data.word !== undefined) setSelectedWord(data.word);
    // Scroll to top on navigation
    setTimeout(() => {
      const s = document.querySelector('.screen');
      if (s) s.scrollTop = 0;
    }, 0);
  }, []);

  return (
    <div id="app-root" style={{ height: '100vh', display: 'flex', flexDirection: 'column', background: 'var(--bg)' }}>
      {screen === 'home' && (
        <HomeScreen navigate={navigate} getLessonProgress={getLessonProgress} />
      )}
      {screen === 'lesson' && selectedLesson && (
        <LessonScreen
          lesson={selectedLesson}
          navigate={navigate}
          getWordMastery={getWordMastery}
          getLessonProgress={getLessonProgress}
        />
      )}
      {screen === 'word' && selectedWord && selectedLesson && (
        <WordReviewScreen
          word={selectedWord}
          lesson={selectedLesson}
          navigate={navigate}
          getWordMastery={getWordMastery}
          updateMastery={updateMastery}
        />
      )}
      {screen === 'quiz' && selectedLesson && (
        <QuizScreen
          lesson={selectedLesson}
          navigate={navigate}
          updateMastery={updateMastery}
          getWordMastery={getWordMastery}
        />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
